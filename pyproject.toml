[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-server-ops"
version = "0.1.0"
description = "A standalone server gateway and Agent skill with durable operations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "quasar2333"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "psutil>=6,<8"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "build>=1,<2", "cryptography>=50,<51"]
tls-setup = ["cryptography>=50,<51"]

[project.scripts]
server-ops = "agent_server_ops.cli:main"
server-ops-gateway = "agent_server_ops.gateway:main"

[project.urls]
Repository = "https://github.com/quasar2333/agent-server-ops"

[tool.setuptools.packages.find]
include = ["agent_server_ops*"]

[tool.setuptools.package-data]
agent_server_ops = ["skills/server-ops/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
